<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません | ありま助産院</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#AF496E">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: #FDF8FB;
      color: #4C3440;
      font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
      text-align: center;
      line-height: 2;
      letter-spacing: .08em;
    }

    .code {
      font-size: 13px;
      letter-spacing: .3em;
      color: #C9758F;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(22px, 6vw, 30px);
      font-weight: 500;
      line-height: 1.8;
      margin-bottom: 24px;
    }

    p {
      font-size: 14.5px;
      color: #5F4551;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      padding: 15px 38px;
      border-radius: 999px;
      background: #B2537B;
      color: #fff;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(175, 73, 110, .26);
    }

    .btn:hover {
      background: #9C3F62;
    }

    .btn:focus-visible {
      outline: 2px solid #AF496E;
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <main>
    <p class="code">404 NOT FOUND</p>
    <h1>ページが<br>見つかりませんでした</h1>
    <p>お探しのページは移動または削除された可能性があります。<br>お手数ですが、トップページからお探しください。</p>
    <a class="btn" href="/">トップページへ戻る</a>
  </main>
</body>

</html>
